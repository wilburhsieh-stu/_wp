<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aim Trainer Lite</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        #game-container {
            width: 800px;
            height: 500px;
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .target {
            width: 40px;
            height: 40px;
            background-color: #ff4757;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #ff4757;
            transition: transform 0.1s;
        }
        .target:active {
            transform: translate(-50%, -50%) scale(0.9);
        }
        #stats {
            width: 800px;
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #2ed573;
            color: #121212;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #27ae60; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        
        #leaderboard-container {
            width: 800px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #333;
        }
        th { color: #2ed573; }
    </style>
</head>
<body>

    <div id="stats">
        <div>時間: <span id="time">30</span>s</div>
        <button id="start-btn" onclick="startGame()">開始遊戲</button>
        <div>分數: <span id="score">0</span></div>
    </div>

    <div id="game-container"></div>

    <div id="leaderboard-container">
        <h2>🏆 全球排行榜</h2>
        <table>
            <thead>
                <tr>
                    <th>名次</th>
                    <th>玩家名稱</th>
                    <th>擊殺數 (分數)</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                </tbody>
        </table>
    </div>

    <script>
        let score = 0;
        let timeLeft = 30;
        let gameInterval;
        let isPlaying = false;

        const gameContainer = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score');
        const timeDisplay = document.getElementById('time');
        const startBtn = document.getElementById('start-btn');

        // 頁面載入時先抓取一次排行榜
        window.onload = fetchLeaderboard;

        function startGame() {
            if (isPlaying) return;
            
            isPlaying = true;
            score = 0;
            timeLeft = 30;
            scoreDisplay.innerText = score;
            timeDisplay.innerText = timeLeft;
            startBtn.disabled = true;
            gameContainer.innerHTML = ''; // 清空場地

            spawnTarget();

            gameInterval = setInterval(() => {
                timeLeft--;
                timeDisplay.innerText = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function spawnTarget() {
            if (!isPlaying) return;
            
            // 確保每次畫面上只有一個目標（訓練甩槍與定位）
            gameContainer.innerHTML = ''; 

            const target = document.createElement('div');
            target.classList.add('target');

            // 隨機計算座標，確保靶不會超出邊界 (考慮靶的半徑 20px)
            const maxX = gameContainer.clientWidth - 40;
            const maxY = gameContainer.clientHeight - 40;
            
            const randomX = Math.floor(Math.random() * maxX) + 20;
            const randomY = Math.floor(Math.random() * maxY) + 20;

            target.style.left = `${randomX}px`;
            target.style.top = `${randomY}px`;

            // 點擊事件
            target.onmousedown = () => {
                score++;
                scoreDisplay.innerText = score;
                spawnTarget(); // 點掉後馬上生出下一個
            };

            gameContainer.appendChild(target);
        }

        async function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            gameContainer.innerHTML = '';
            startBtn.disabled = false;
            startBtn.innerText = "再玩一次";

            // 遊戲結束，要求輸入名稱
            setTimeout(async () => {
                const playerName = prompt(`時間到！你的分數是: ${score}\n請輸入你的大名上傳排行榜：`, "Player");
                
                if (playerName) {
                    await submitScore(playerName, score);
                    await fetchLeaderboard();
                }
            }, 100);
        }

        // --- 與後端 API 互動 ---

        async function submitScore(name, score) {
            try {
                await fetch('/api/score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, score })
                });
            } catch (err) {
                console.error("上傳分數失敗", err);
            }
        }

        async function fetchLeaderboard() {
            try {
                const response = await fetch('/api/leaderboard');
                const data = await response.json();
                
                const tbody = document.getElementById('leaderboard-body');
                tbody.innerHTML = '';

                data.forEach((entry, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>#${index + 1}</td>
                        <td>${entry.name}</td>
                        <td>${entry.score}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error("無法取得排行榜", err);
            }
        }
    </script>
</body>
</html>
